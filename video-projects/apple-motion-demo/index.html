<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=3840" />
    <title>Creations premium</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=block"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 2160px;
        height: 3840px;
        overflow: hidden;
        background: #020305;
        color: #f8fbff;
        font-family: "Inter", system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 2160px;
        height: 3840px;
        overflow: hidden;
        --accent: #7cf7e8;
        --accent-soft: color-mix(in srgb, var(--accent) 34%, transparent);
      }
      .stage-bg,
      .grid,
      .vignette,
      .light-sweep,
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .stage-bg {
        background:
          radial-gradient(circle at 50% 18%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 28%),
          radial-gradient(circle at 82% 72%, rgba(255,255,255,0.10), transparent 24%),
          linear-gradient(180deg, #07090e 0%, #020305 58%, #000 100%);
      }
      .grid {
        top: 47%;
        height: 70%;
        transform: perspective(1620px) rotateX(62deg);
        transform-origin: center top;
        opacity: 0.55;
        background:
          repeating-linear-gradient(90deg, rgba(255,255,255,0.11) 0 2px, transparent 2px 151px),
          repeating-linear-gradient(0deg, rgba(255,255,255,0.09) 0 2px, transparent 2px 151px);
        mask-image: linear-gradient(180deg, transparent, #000 18%, #000 70%, transparent);
      }
      .vignette {
        background: radial-gradient(ellipse at center, transparent 34%, rgba(0,0,0,0.88) 82%, #000 100%);
      }
      .grain {
        opacity: 0.32;
        background-image:
          radial-gradient(circle at 1px 1px, rgba(255,255,255,0.08) 1px, transparent 0),
          radial-gradient(circle at 3px 4px, rgba(255,255,255,0.045) 1px, transparent 0);
        background-size: 7px 7px, 11px 11px;
        mix-blend-mode: screen;
      }
      .light-sweep {
        width: 24%;
        left: -30%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.82), var(--accent), transparent);
        filter: blur(26px);
        transform: skewX(-18deg);
        opacity: 0;
      }
      .hero {
        position: absolute;
        inset: 0;
        display: flex;
        gap: 119px;
        padding: 162px;
        align-items: center;
        justify-content: center;
      }
      .copy {
        position: relative;
        z-index: 2;
        max-width: 100%;
        text-align: center;
      }
      .eyebrow {
        margin-bottom: 54px;
        font-family: "JetBrains Mono", monospace;
        font-size: 52px;
        line-height: 1;
        letter-spacing: 0;
        color: var(--accent);
        text-transform: uppercase;
      }
      h1 {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 52px;
        font-size: 313px;
        line-height: 0.9;
        font-weight: 900;
      }
      .word {
        display: inline-block;
        background: linear-gradient(180deg, #fff 0%, #e8edf4 42%, #8f9aa8 74%, #fff 100%);
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 0 0 76px rgba(255,255,255,0.16);
      }
      .subtitle {
        max-width: 1620px;
        margin-top: 76px;
        font-size: 95px;
        line-height: 1.18;
        color: rgba(248,251,255,0.72);
      }
      .hero-kinetic {
        text-align: center;
      }
      .hero-kinetic .copy,
      .hero-kinetic {
        flex-direction: column;
      }
      .hero-kinetic h1,
      .hero-kinetic .subtitle {
        margin-left: auto;
        margin-right: auto;
      }
      .card-stack {
        position: relative;
        width: 1188px;
        height: 1555px;
        perspective: 2592px;
      }
      .glass-card {
        position: absolute;
        width: 950px;
        height: 1210px;
        border-radius: 82px;
        padding: 97px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 2px solid rgba(255,255,255,0.18);
        background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04) 42%, rgba(255,255,255,0.10));
        box-shadow:
          inset 0 2px 0 rgba(255,255,255,0.24),
          0 119px 281px rgba(0,0,0,0.45),
          0 0 151px var(--accent-soft);
        backdrop-filter: blur(28px) saturate(1.15);
      }
      .glass-card span {
        font-family: "JetBrains Mono", monospace;
        font-size: 56px;
        color: rgba(255,255,255,0.62);
      }
      .glass-card strong {
        font-size: 216px;
        line-height: 0.9;
      }
      .card-a { left: 4%; top: 13%; transform: rotateY(-14deg) rotateZ(-8deg); }
      .card-b { left: 24%; top: 3%; transform: translateZ(60px); }
      .card-c { left: 39%; top: 22%; transform: rotateY(13deg) rotateZ(9deg); }
      .product-shell {
        width: 1339px;
        aspect-ratio: 0.72;
        border-radius: 82px;
        padding: 76px;
        border: 2px solid rgba(255,255,255,0.18);
        background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03));
        box-shadow: 0 130px 346px rgba(0,0,0,0.58);
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 59px;
        background:
          radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 23%),
          linear-gradient(180deg, #151923, #05070b);
      }
      .screen-bar,
      .screen-row {
        position: absolute;
        left: 10%;
        height: 3.4%;
        border-radius: 999px;
        background: rgba(255,255,255,0.74);
      }
      .screen-bar { top: 9%; width: 36%; background: var(--accent); }
      .screen-row { top: 70%; width: 58%; }
      .screen-row.wide { top: 62%; width: 78%; }
      .screen-row.short { top: 78%; width: 42%; }
      .orb-core {
        position: absolute;
        width: 34%;
        aspect-ratio: 1;
        left: 50%;
        top: 42%;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 35% 25%, #fff, var(--accent) 42%, #14242a 78%);
        box-shadow: 0 0 259px var(--accent);
      }
      .product-copy {
        max-width: 100%;
      }
      @media (orientation: portrait) {
        .hero-cards,
        .hero-product {
          flex-direction: column;
        }
        .hero-product .product-shell {
          order: 2;
        }
        .hero-product .product-copy {
          order: 1;
        }
        .copy {
          text-align: center;
        }
        h1 {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="apple-motion-demo"
      data-start="0"
      data-duration="6"
      data-width="2160"
      data-height="3840"
    >
      <div class="stage-bg"></div>
      <div class="grid"></div>
      <div class="light-sweep"></div>
      
        <section class="hero hero-cards">
          <div class="copy">
            <p class="eyebrow">Motion Generator</p>
            <h1><span class="word">Creations</span>
            <span class="word">premium</span></h1>
            <p class="subtitle">Choisis le format, le style et le rythme en quelques secondes.</p>
          </div>
          <div class="card-stack" aria-hidden="true">
            <div class="glass-card card-a"><span>Hook</span><strong>0.4s</strong></div>
            <div class="glass-card card-b"><span>Reveal</span><strong>1.2s</strong></div>
            <div class="glass-card card-c"><span>Hold</span><strong>2.8s</strong></div>
          </div>
        </section>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set(".word, .subtitle, .eyebrow", { opacity: 0 });
      gsap.set(".glass-card, .product-shell", { opacity: 0 });

      tl.fromTo(".grid",
        { y: 86, opacity: 0 },
        { y: 0, opacity: 0.55, duration: 1.2, ease: "power3.out" },
        0
      );
      tl.to(".light-sweep",
        { x: 11232, opacity: 0.82, duration: 0.58, ease: "power3.inOut" },
        0.08
      );
      tl.to(".light-sweep", { opacity: 0, duration: 0.24, ease: "power2.out" }, 0.66);
      tl.fromTo(".eyebrow",
        { y: 54, opacity: 0, filter: "blur(18px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
        0.22
      );
      tl.fromTo(".word",
        { y: 216, scale: 0.82, opacity: 0, filter: "blur(30px)" },
        { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.82, ease: "power4.out", stagger: 0.08 },
        0.34
      );
      tl.fromTo(".subtitle",
        { y: 86, opacity: 0, filter: "blur(16px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.62, ease: "power3.out" },
        1.12
      );
      tl.fromTo(".glass-card",
        { y: 194, rotateX: 16, scale: 0.92, opacity: 0, filter: "blur(22px)" },
        { y: 0, rotateX: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out", stagger: 0.11 },
        0.72
      );
      tl.fromTo(".product-shell",
        { y: 259, scale: 0.88, opacity: 0, filter: "blur(24px)" },
        { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.95, ease: "power3.out" },
        0.62
      );
      tl.to(".orb-core", { rotate: 360, duration: 6, ease: "none" }, 0);
      tl.to(".vignette", { opacity: 0.82, duration: 2.2, repeat: Math.max(0, Math.floor(6 / 2.2) - 1), yoyo: true, ease: "sine.inOut" }, 0);
      tl.to(".grid", { backgroundPosition: "0px 346px", duration: 6, ease: "none" }, 0);
      tl.to(".word", { y: -76, opacity: 0, filter: "blur(18px)", duration: 0.36, ease: "power2.in", stagger: 0.025 }, 5.3);
      tl.to(".subtitle, .eyebrow, .glass-card, .product-shell", { opacity: 0, filter: "blur(18px)", duration: 0.34, ease: "power2.in" }, 5.48);
      tl.to({}, { duration: 6 }, 0);

      window.__timelines["apple-motion-demo"] = tl;
    </script>
  </body>
</html>
